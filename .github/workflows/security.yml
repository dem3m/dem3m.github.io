name: Security checks
on:
  pull_request:
  schedule:
    - cron: '19 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run security:check
      - run: npm audit --audit-level=low --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm run security:check -- --dist
